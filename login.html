<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | MyCommunidad</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="auth"><aside class="auth-aside"><a class="brand" href="index.html"><span class="brand-mark">M</span>MyCommunidad</a><h1>Your community,<br>moving forward.</h1><p>Report local problems and follow progress with your barangay.</p></aside><section class="auth-panel"><form class="auth-box" id="login-form"><h1>Welcome back</h1><p>Sign in to view your community.</p><div class="form-error" role="alert"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><a class="auth-link" id="forgot" href="#">Forgot password?</a><button class="button" style="width:100%;margin-top:21px">Sign in</button><p class="form-hint" style="text-align:center;margin-top:22px">New to MyCommunidad? <a class="auth-link" href="register.html">Create an account</a></p></form></section></main><script type="module" src="js/auth.js"></script></body></html>
