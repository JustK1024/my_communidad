<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | MyCommunidad</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="auth"><aside class="auth-aside"><a class="brand" href="index.html"><span class="brand-mark">M</span>MyCommunidad</a><h1>Make a difference<br>where you live.</h1><p>Your private contact information is never shown on public reports.</p></aside><section class="auth-panel"><form class="auth-box" id="register-form"><h1>Create your account</h1><p>Join your barangay’s community reporting space.</p><div class="form-error" role="alert"></div><div class="field"><label for="display-name">Display name</label><input id="display-name" required maxlength="60" placeholder="How neighbors will know you"></div><div class="field-grid"><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><div class="field"><label for="phone">Phone number <small>(private)</small></label><input id="phone" type="tel" required></div></div><div class="field"><label for="address">Useful address <small>(private)</small></label><input id="address" required placeholder="House no., street or purok"></div><div class="field"><label for="barangay">Barangay</label><select id="barangay" required><option value="demo-san-roque">Barangay San Roque — DEMO</option><option value="demo-mabini">Barangay Mabini — DEMO</option></select><p class="form-hint">This list loads from Firestore once configured.</p></div><div class="field-grid"><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" minlength="8" required></div></div><label class="check"><input id="terms" type="checkbox">I agree to the Terms of Use.</label><label class="check"><input id="privacy" type="checkbox">I have read the <a class="auth-link" href="privacy.html">Privacy Notice</a>.</label><button class="button" style="width:100%;margin-top:13px">Create account</button><p class="form-hint" style="text-align:center">Already registered? <a class="auth-link" href="login.html">Sign in</a></p></form></section></main><script type="module" src="js/auth.js"></script></body></html>
